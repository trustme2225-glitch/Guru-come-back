<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guru's Come Back</title>
<meta name="description" content="Guru's daily knee rehab routine">
<meta name="theme-color" content="#1F5F7A">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Come Back">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column like a clinic handout — header with phase band, exercise cards in prescribed order, then the 5-week log. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#16232B; --muted:#5B6B72; --line:#DCE4E2;
  --accent:#1F5F7A; --accent-ink:#FFFFFF; --done:#2E8B57; --done-soft:#DDF0E4;
  /* Phase colours borrowed from resistance-band grades */
  --p30:#E8B21C; --p45:#D9483B; --p60:#2E8B57;
  --track:#E6ECEA;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#172228; --ink:#E6EEF0; --muted:#93A4AB; --line:#26343B;
  --accent:#5FB0D1; --accent-ink:#0F171B; --done:#5CC48A; --done-soft:#1C3A2A;
  --p30:#F0C13C; --p45:#EE6A5D; --p60:#5CC48A; --track:#22313A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#172228; --ink:#E6EEF0; --muted:#93A4AB; --line:#26343B;
  --accent:#5FB0D1; --accent-ink:#0F171B; --done:#5CC48A; --done-soft:#1C3A2A;
  --p30:#F0C13C; --p45:#EE6A5D; --p60:#5CC48A; --track:#22313A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,38px);font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.summary{display:flex;gap:20px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.phase button{border:0;background:transparent;border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.phase button .sec{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.phase button .lbl{font-size:12px;color:var(--muted)}
.phase button .band{width:28px;height:5px;border-radius:3px;background:var(--c)}
.phase button[aria-pressed="true"]{background:var(--bg);box-shadow:inset 0 0 0 2px var(--c)}
.phase-note{font-size:14px;color:var(--muted);margin:0}

.motto{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(17px,4.4vw,20px);line-height:1.35;color:var(--ink);padding-left:12px;border-left:4px solid var(--p45);text-wrap:pretty}
.progress{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--done);width:0;transition:width .4s ease}

.list{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s}
.card.done{border-color:var(--done)}
.card.active{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.card-head{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.card.done .num{background:var(--done);border-color:var(--done);color:var(--surface)}
.card-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card-title h3{font-size:19px;font-weight:700}
.rx{font-size:14px;color:var(--muted)}
.check{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.card.done .check{background:var(--done-soft);border-color:var(--done);color:var(--done)}
details{font-size:15px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:14px}
details ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--pc);stroke-linecap:round;transition:stroke .2s}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.ring .t small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.controls{display:flex;flex-direction:column;gap:8px;flex:1;min-width:160px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.meta{font-size:13px;color:var(--muted)}

.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{flex:1;min-width:80px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--muted)}
.set b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.set.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.set.full{background:var(--done-soft);border-color:var(--done)}
.set.full b{color:var(--done)}
.rep{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tap{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:20px;padding:16px 24px;min-width:150px}
.tap:active{transform:scale(.98)}
.tap:disabled{opacity:.5;cursor:default}

.log{display:flex;flex-direction:column;gap:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:700;letter-spacing:.04em}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--track);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);position:relative}
.day.l1{background:color-mix(in srgb,var(--done) 25%,var(--track))}
.day.l2{background:color-mix(in srgb,var(--done) 55%,var(--track));color:var(--ink)}
.day.l3{background:var(--done);color:var(--surface);font-weight:700}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.day.future{background:transparent;border:1px dashed var(--line)}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.reset-row{display:flex;gap:8px;flex-wrap:wrap}
#reset-sess.armed{background:var(--p45);border-color:var(--p45);color:var(--surface)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
.save{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.sessions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sess{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left}
.sess svg{flex:none;width:26px;height:26px}
.sess .sl{display:flex;flex-direction:column;min-width:0}
.sess .sl b{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.2}
.sess .sl span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sess[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sess.complete .sl span{color:var(--done);font-weight:700}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--bg);border-radius:12px}
.legs button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.legs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legs button.ok{color:var(--done)}
.legs button .dot{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:11px;line-height:1}
.legs button.ok .dot{background:var(--done);border-color:var(--done);color:var(--surface)}
.both{font-size:14px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.rest-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rest{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rest button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.rest button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ring.resting .fg{stroke:var(--muted)}
.dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:1px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track);display:inline-block}
.dots i.on{background:var(--done)}
.weeks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.weeks::-webkit-scrollbar{display:none}
.weeks button{flex:1 0 auto;min-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.weeks button small{font-family:var(--body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.checkbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;text-align:left;min-width:0}
.checkbtn .box{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;font-size:16px}
.checkbtn .cl{display:flex;flex-direction:column;min-width:0}
.checkbtn .cl b{font-size:15px}
.checkbtn .cl small{font-size:12px;color:var(--muted)}
.checkbtn.ok{border-color:var(--done);background:var(--done-soft)}
.checkbtn.ok .box{background:var(--done);border-color:var(--done);color:var(--surface)}
.checkbtn.ok .cl small{color:var(--done)}
.legchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
.chip b{font-size:14px}
.chip small{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .dots{margin:0}
.chip.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.chip.ok{border-color:var(--done)}
.chip.ok small{color:var(--done);font-weight:700}
.btn:disabled{opacity:.6;cursor:default}
.sound-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sound-row .btn{padding:8px 14px;font-size:14px}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="eyebrow" id="today-label">Today</div>
        <h1>Guru's Come Back</h1>
      </div>
      <div class="summary">
        <div class="stat"><b id="sess-count">0/2</b><span>sessions today</span></div>
        <div class="stat"><b id="streak">0</b><span>full-day streak</span></div>
      </div>
    </div>
    <div class="weeks" role="group" aria-label="Plan week">
      <button type="button" id="wk-1" data-w="w1"><small>Plan</small>Week 1</button>
      <button type="button" id="wk-2" data-w="w2"><small>Plan</small>Week 2</button>
    </div>
    <p class="motto" id="motto"></p>
    <div class="sessions" role="group" aria-label="Session">
      <button type="button" class="sess" id="s-am" data-s="am">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--p30)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="var(--p30)"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <span class="sl"><b>Morning</b><span id="s-am-n"></span></span>
      </button>
      <button type="button" class="sess" id="s-pm" data-s="pm">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="var(--accent)"/></svg>
        <span class="sl"><b>Evening</b><span id="s-pm-n"></span></span>
      </button>
    </div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div>
      <div class="eyebrow" style="margin-bottom:8px">Hold phase</div>
      <div class="phase" role="group" aria-label="Hold phase">
        <button type="button" id="ph-30" data-p="30" style="--c:var(--p30)"><span class="band"></span><span class="sec">30s</span><span class="lbl">Phase 1</span></button>
        <button type="button" id="ph-45" data-p="45" style="--c:var(--p45)"><span class="band"></span><span class="sec">45s</span><span class="lbl">Phase 2</span></button>
        <button type="button" id="ph-60" data-p="60" style="--c:var(--p60)"><span class="band"></span><span class="sec">60s</span><span class="lbl">Phase 3</span></button>
      </div>
    </div>
    <div class="rest-row">
      <span class="eyebrow">Rest between sets</span>
      <div class="rest" role="group" aria-label="Rest between sets">
        <button type="button" id="r-10" data-r="10">10s</button>
        <button type="button" id="r-15" data-r="15">15s</button>
        <button type="button" id="r-20" data-r="20">20s</button>
      </div>
    </div>
    <div class="sound-row">
      <p class="phase-note" id="phase-note" style="flex:1;min-width:200px"></p>
      <button type="button" class="btn ghost" id="test-sound">Test buzzer</button>
    </div>
  </header>

  <ol class="list" id="list"></ol>

  <section class="log">
    <h2>Last 5 weeks</h2>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i style="background:var(--track)"></i>None</span>
      <span><i style="background:color-mix(in srgb,var(--done) 25%,var(--track))"></i>Started</span>
      <span><i style="background:color-mix(in srgb,var(--done) 55%,var(--track))"></i>1 session</span>
      <span><i style="background:var(--done)"></i>Both sessions</span>
    </div>
  </section>

  <footer>
    <div class="reset-row">
      <button type="button" class="btn ghost" id="reset-sess">Reset morning session</button>
      <button type="button" class="btn ghost" id="reset-cancel" hidden>Cancel</button>
    </div>
    <span class="save" id="save-status">Saved on this phone</span>
    <span>Follow your doctor's or physiotherapist's instructions. Stop if you feel sharp pain.</span>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="track" preload="auto" playsinline></audio>
<audio id="fx" preload="auto" playsinline></audio>

<script>
/* ---------- programs ----------
   type "hold":  timed holds, alternating L/R, `sets` per leg, `hold` = fixed seconds (else the phase)
   type "reps":  rep counter per leg (+ Mark done), `reps` × `sets`
   type "check": just Mark done per leg, `reps` or `repsBy` {L,R} shown as the target */
const STEP = {
  quad:["Lie or sit with your leg straight out in front of you.","Tighten the muscle on the front of your thigh, pressing the back of your knee down.","Hold for the phase time, then relax."],
  ham:["Sit with your leg straight and the other knee bent.","Keep your back straight and lean forward from the hips until you feel a gentle stretch behind the thigh.","Hold for the phase time, then relax."],
  inner:["Lie on your back or sit with knees bent and a pillow or ball between your knees.","Squeeze your knees together. This works both legs at once.","Hold the squeeze for the phase time, then relax."],
  slr:["Lie on your back with the other knee bent and foot flat.","Tighten your thigh and lift the straight leg to the height of the other knee.","Lower it slowly."],
  slrh:["Lie on your back with the other knee bent.","Tighten your thigh and lift the straight leg to the height of the other knee.","Hold it up for the set time, then lower slowly."],
};
const PROGRAMS = {
  w1: {name:"Week 1", ex:[
    {id:"quad", name:"Quadriceps", type:"hold", sets:4, steps:STEP.quad},
    {id:"ham", name:"Hamstring", type:"hold", sets:4, steps:STEP.ham},
    {id:"inner", name:"Inner thigh", type:"hold", sets:4, both:true, steps:STEP.inner},
    {id:"flex", name:"Sitting knee flexion", type:"hold", sets:4,
     steps:["Sit on a chair with your feet flat on the floor.","Slide your foot back under the chair to bend the knee as far as is comfortable.","Hold for the phase time, then slide it forward again."]},
    {id:"slr", name:"Straight leg raise", type:"reps", reps:15, sets:3, steps:STEP.slr},
    {id:"slrh", name:"Straight leg raise hold", type:"hold", hold:60, sets:4, steps:STEP.slrh},
  ]},
  w2: {name:"Week 2", ex:[
    {id:"w2quad", name:"Quadriceps", type:"hold", sets:3, steps:STEP.quad},
    {id:"w2ham", name:"Hamstring", type:"hold", sets:3, steps:STEP.ham},
    {id:"w2inner", name:"Inner thigh", type:"hold", sets:3, both:true, steps:STEP.inner},
    {id:"feet", name:"Feet stretch", type:"check", both:true, reps:20,
     steps:["Sit or lie with your legs straight.","Pull your toes up towards you, then point them away. That's one rep.","Do 20 slow reps, then tap Mark done."]},
    {id:"kneefwd", name:"Knee forward", type:"check", repsBy:{R:20, L:15}, holdNote:"drag, hold 10s, release",
     steps:["Sit with your leg out in front of you.","Drag the knee forward as far as is comfortable and hold for 10 seconds.","Release. Right leg 20 times, left leg 15 times, then tap Mark done for each leg."]},
    {id:"sidedrag", name:"Side leg drag (45°)", type:"check", reps:20,
     steps:["Lie on your back with both legs straight.","Slide (drag) one leg out to the side, about 45 degrees, keeping the toes pointing up.","Slide it back to the middle. 20 reps each leg, then tap Mark done."]},
    {id:"w2slr", name:"Straight leg raise", type:"reps", reps:20, sets:1, steps:STEP.slr},
    {id:"w2slrh", name:"Straight leg raise hold", type:"hold", hold:30, sets:3, steps:STEP.slrh},
    {id:"sideraise", name:"Side leg raise", type:"reps", reps:20, sets:1,
     steps:["Lie on your side with the bottom knee slightly bent.","Keep the top leg straight and lift it up towards the ceiling.","Lower it slowly."]},

/* ---------- data ----------
   state.log[YYYY-MM-DD] = { am: S, pm: S }
   S = { h: {holds done per key}, r: {key: {s,r}}, c: {key: 1}, slr: {L:{s,r},R:{s,r}} (week 1 leg raise) }  */
const newSess = () => ({h:{}, r:{}, c:{}, slr:{L:{s:0,r:0}, R:{s:0,r:0}}});
function fixSess(S){ S ||= newSess(); S.h ||= {}; S.r ||= {}; S.c ||= {}; S.slr ||= {}; for (const l of ["L","R"]){ S.slr[l] ||= {s:0,r:0}; S.slr[l].s ||= 0; S.slr[l].r ||= 0; } return S; }
function migrate(st){
  st = st && typeof st === "object" ? st : {};
  st.phase = [30,45,60].includes(st.phase) ? st.phase : 30;
  st.rest = [10,15,20].includes(st.rest) ? st.rest : 10;
  const prevV = st.v;
  st.log ||= {};
  for (const [k,d] of Object.entries(st.log)){
    if (d && (d.am || d.pm)) { d.am = fixSess(d.am); d.pm = fixSess(d.pm); continue; }
    if (prevV >= 2) continue;
    // very old single-session format → morning, both legs
    const am = newSess();
    for (const [id,n] of Object.entries(d?.holds||{})){ if (!n) continue; if (id==="inner") am.h.inner=n; else { am.h[id+"-L"]=n; am.h[id+"-R"]=n; } }
    for (const l of ["L","R"]) am.slr[l] = {s:d?.slrSets||0, r:d?.slrReps||0};
    st.log[k] = {am, pm:newSess()};

  if (!(prevV >= 3)) for (const d of Object.values(st.log)) for (const S of [d.am,d.pm]) for (const k in S.h) if (S.h[k] > 0) S.h[k] = 4;
  // v4 adds weeks: anyone upgrading moves on to Week 2
  if (!WEEKS.includes(st.week)) st.week = prevV ? "w2" : "w1";
  st.v = 4; return st;
}

const legSel = {}; // exercise id -> "L" | "R"

function dayRec(k = todayKey()){ state.log[k] ||= {am:newSess(), pm:newSess()}; const d = state.log[k]; d.am = fixSess(d.am); d.pm = fixSess(d.pm); return d; }

const legsOf = ex => ex.both ? ["B"] : ["L","R"];
const hkey = (ex,leg) => ex.both ? ex.id : ex.id+"-"+leg;
const repsFor = (ex, leg) => ex.repsBy ? ex.repsBy[leg] : ex.reps;
function repOf(ex, leg, S){ if (ex.id==="slr") return S.slr[leg]; const k = hkey(ex,leg); return S.r[k] ||= {s:0,r:0}; }
const setsOf = (ex, leg, S = sess()) => Math.min(ex.sets, S.h[hkey(ex,leg)]||0);
function unitProgress(ex, leg, S){
  if (ex.type==="check") return S.c[hkey(ex,leg)] ? 1 : 0;
  if (ex.type==="reps"){ const R = repOf(ex,leg,S); return Math.min(1, (R.s*ex.reps + R.r)/(ex.sets*ex.reps)); }

const unitDone = (ex, leg, S) => unitProgress(ex, leg, S) >= 1;
const exDone = (ex, S) => legsOf(ex).every(l=>unitDone(ex,l,S));
const countDone = (S, list = EXL()) => list.filter(e=>exDone(e,S)).length;
const totalUnits = (list = EXL()) => list.reduce((a,e)=>a+legsOf(e).length,0);
const unitsDone = (S, list = EXL()) => list.reduce((a,e)=>a+legsOf(e).reduce((b,l)=>b+unitProgress(e,l,S),0),0);
// a session counts as complete if every exercise of either week's plan is done
const sessComplete = S => WEEKS.some(w=>countDone(S, PROGRAMS[w].ex)===PROGRAMS[w].ex.length);
const sessStarted = S => WEEKS.some(w=>unitsDone(S, PROGRAMS[w].ex) > 0);
function curLeg(ex){
  if (ex.both) return "B";
  if (!legSel[ex.id]) legSel[ex.id] = legsOf(ex).find(l=>!unitDone(ex,l,sess())) || "L";
  return legSel[ex.id];
}

/* ---------- persistence ---------- */
let dbDoc = null, saveTimer = null, writing = false, dirty = false;
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (!dbDoc) return;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600);
}
async function flush(){
  if (writing || !dirty) return;
  writing = true; dirty = false;
  try { await dbDoc.set(JSON.parse(JSON.stringify(state))); setSave("Saved to your account"); }
  catch(e){ setSave("Saved on this device only"); if (e && e.code==="invalid_argument") dbDoc = null; }
  writing = false; if (dirty) flush();
}
function setSave(t){ document.getElementById("save-status").textContent = t; }

async function connect(){
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/"+id+"/routine");
    const snap = await ref.get();
    if (snap.exists){
      // Your account copy is the source of truth, so undo/reset sticks across devices
      state = migrate(JSON.parse(JSON.stringify(snap.data())));
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    }
    dbDoc = ref; setSave("Saved to your account");
    if (!snap.exists && Object.keys(state.log).length) { dirty = true; flush(); }
    renderAll();
  } catch(e){ /* stay on device storage */ }
}

/* ---------- sound ----------
   Sounds are rendered into real WAV audio and played through <audio> elements.
   Unlike plain Web Audio beeps, media audio plays with the iPhone silent switch on
   and keeps playing if the screen locks, so the buzzer still sounds at the end. */
const SR = 11025;
function renderWav(seconds, events){
  const n = Math.ceil(seconds*SR), buf = new Float32Array(n);
  for (const ev of events){
    const i0 = Math.floor(ev.at*SR), len = Math.floor(ev.dur*SR);
    for (let i=0;i<len && i0+i<n;i++){
      const t = i/SR;
      const env = Math.min(1, t/0.01, (ev.dur-t)/0.03);
      let v = 0;
      for (const f of ev.f){
        const ph = (t*f)%1;
        v += ev.wave==="square" ? (ph<.5?1:-1) : Math.sin(2*Math.PI*ph);
      }
      buf[i0+i] += v/ev.f.length * ev.vol * env;
    }
  }
  const bytes = new Uint8Array(44+n);
  const dv = new DataView(bytes.buffer);
  const str = (o,s)=>{ for (let i=0;i<s.length;i++) bytes[o+i]=s.charCodeAt(i); };
  str(0,"RIFF"); dv.setUint32(4,36+n,true); str(8,"WAVE"); str(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true); dv.setUint32(28,SR,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  str(36,"data"); dv.setUint32(40,n,true);
  for (let i=0;i<n;i++){ const v = Math.max(-1,Math.min(1,buf[i])); bytes[44+i] = Math.round(128+v*127); }
  return URL.createObjectURL(new Blob([bytes],{type:"audio/wav"}));
}
const BUZZ = at => [0,.5,1.0].map((o,i)=>({at:at+o, dur:i===2?.9:.38, f:[180,186], wave:"square", vol:.9}));
const BUZZ_LEN = 2.0;
const sounds = {};
// One track for the remaining sets: get ready, then hold → buzzer → rest (with 3-2-1) → next hold …
function holdTrack(phase, rest, n){
  return sounds[`hold${phase}-${rest}-${n}`] ||= renderWav(LEAD + n*phase + (n-1)*rest + BUZZ_LEN + .2, [
    ...[0,1,2].map(t=>({at:t, dur:.08, f:[520], vol:.6})),
    ...Array.from({length:n}, (_,i)=>{
      const st = LEAD + i*(phase+rest), end = st + phase;
      const ev = [{at:st, dur:.22, f:[990], vol:.7}, ...[3,2,1].map(s=>({at:end-s, dur:.07, f:[700], vol:.6})), ...BUZZ(end)];
      if (i < n-1) ev.push(...[3,2,1].map(s=>({at:end+rest-s, dur:.08, f:[520], vol:.6})));
      return ev;
    }).flat(),
  ]);
}
const buzzerTrack = () => sounds.buzz ||= renderWav(BUZZ_LEN+.2, BUZZ(0));
const tickTrack = () => sounds.tick ||= renderWav(.1, [{at:0, dur:.06, f:[740], vol:.6}]);
const setTrack = () => sounds.set ||= renderWav(.5, [{at:0, dur:.15, f:[880], vol:.6},{at:.18, dur:.22, f:[1175], vol:.6}]);
const trackEl = document.getElementById("track"), fxEl = document.getElementById("fx");
function unlockAudio(){
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
}
function playEl(el, url, from=0){
  unlockAudio();
  try {
    if (el.dataset.src !== url){ el.src = url; el.dataset.src = url; }
    el.currentTime = from; el.volume = 1;
    const p = el.play(); return p && p.catch ? p.then(()=>true).catch(()=>false) : Promise.resolve(true);
  } catch(e){ return Promise.resolve(false); }
}
function fx(url){ return playEl(fxEl, url); }
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3000); }
let wakeLock = null;
async function lockScreen(on){
  try { if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release",()=>{wakeLock=null;}); }
        if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; } } catch(e){ wakeLock = null; }

/* ---------- timer ---------- */
const C = 2*Math.PI*42;
let run = null;
const phaseColor = () => `var(--p${state.phase})`;
const ringColor = ex => ex.hold ? `var(--p${[30,45,60].includes(ex.hold)?ex.hold:30})` : phaseColor();

// Remaining holds for an exercise, alternating: L1, R1, L2, R2, … (skips sets already done)
function queueFor(ex, S){
  const q = [];
  for (let r = 0; r < ex.sets; r++) for (const leg of legsOf(ex)) if (setsOf(ex,leg,S) <= r) q.push({leg, set:r+1});
  return q;
}
function elapsedOf(r){ return r.paused ? r.pausedAt : (performance.now() - r.t0)/1000; }
// Where are we in the run? lead → (hold, rest) × n
function phaseAt(r, e){
  if (e < LEAD) return {stage:"lead", left: LEAD - e, i:0};
  const x = e - LEAD, cyc = r.dur + r.rest, i = Math.min(r.n-1, Math.floor(x/cyc)), w = x - i*cyc;
  if (w < r.dur) return {stage:"hold", left: r.dur - w, i};
  return {stage:"rest", left: cyc - w, i: i+1};
}
const holdsCompleted = (r, e) => Math.max(0, Math.min(r.n, Math.floor((e - LEAD - r.dur)/(r.dur + r.rest)) + 1));

function startTimer(id){
  const ex = exById(id);
  if (run && run.paused && run.id===id){
    run.t0 = performance.now() - run.pausedAt*1000; run.paused = false;
    playEl(trackEl, run.url, run.pausedAt).then(ok=>{ if (run) run.audioOk = ok; });
    lockScreen(true); tick(); updateCard(id); return;
  }
  if (run) stopTimer();
  const q = queueFor(ex, sess()); if (!q.length) return;
  const dur = holdOf(ex), rest = state.rest, n = q.length;
  run = {id, sess:session, q, dur, rest, n, credited:0, t0:performance.now(), paused:false, audioOk:true, lastKey:"lead"};
  run.url = holdTrack(dur, rest, n);
  run.total = LEAD + n*dur + (n-1)*rest;
  playEl(trackEl, run.url, 0).then(ok=>{ if (run) run.audioOk = ok; });
  lockScreen(true); tick(); updateActive(); updateCard(id);
}
function pauseTimer(){
  if (!run || run.paused) return;
  run.pausedAt = elapsedOf(run); run.paused = true;
  try { trackEl.pause(); } catch(e){}
  lockScreen(false); updateCard(run.id);
}
function stopTimer(){
  const id = run?.id; run = null;
  try { trackEl.pause(); trackEl.currentTime = 0; } catch(e){}
  lockScreen(false); if (id){ renderAll(); }
}
function creditHolds(r, upto){
  const ex = exById(r.id), S = dayRec()[r.sess];
  for (let i = r.credited; i < upto; i++){ const k = hkey(ex, r.q[i].leg); S.h[k] = Math.min(ex.sets, (S.h[k]||0)+1); }
  r.credited = upto; S.phase = state.phase; save();
}
function tick(){
  if (!run || run.paused) return;
  const r = run, e = elapsedOf(r), ex = exById(r.id);
  // credit finished holds (also catches up after the screen was locked)
  const done = holdsCompleted(r, e);
  if (done > r.credited){
    creditHolds(r, done);
    if (done < r.n){
      if (!r.audioOk) fx(buzzerTrack());
      vibrate([300,80,300]);
      const prev = r.q[done-1], nx = r.q[done];
      toast(ex.both ? `Set ${prev.set} done · rest ${r.rest}s` : `${LEGWORD[prev.leg]} set ${prev.set} done · switch to ${LEGWORD[nx.leg].toLowerCase()} leg`);
      updateMeta(r.id); updateLegs(r.id);
    }
  }
  if (e >= r.total){ finishHold(); return; }
  const p = phaseAt(r, e), k = p.stage + p.i;
  if (k !== r.lastKey){ if (p.stage==="hold") vibrate(80); r.lastKey = k; updateLegs(r.id); }
  drawRing(r.id);
  requestAnimationFrame(tick);
}
function finishHold(){
  const r = run; run = null; lockScreen(false);
  if (!r.audioOk) fx(buzzerTrack()); // track didn't play: sound the buzzer now
  vibrate([400,100,400,100,800]);
  creditHolds(r, r.n);
  afterUnit(exById(r.id), r.sess);
}
function afterUnit(ex, s){
  const S = dayRec()[s];
  renderAll();
  if (!exDone(ex,S)) return;
  if (countDone(S) === EXL().length){
    const both = sessComplete(dayRec().am) && sessComplete(dayRec().pm);
    toast(both ? ALL_DONE : s==="am" ? AM_DONE : "Evening session done. Great work, Guru!");
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    toast(`${cheer()} ${ex.name} done`);
    focusNext(ex.id);
  }
}
function focusNext(id){
  const list = EXL(), idx = list.findIndex(e=>e.id===id), S = sess();
  const nxt = list.slice(idx+1).concat(list.slice(0,idx)).find(e=>!exDone(e,S));
  if (nxt){ const el=document.getElementById("card-"+nxt.id); el && el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"center"}); }
}
function drawRing(id){
  const card = document.getElementById("card-"+id); if (!card) return;
  const fg = card.querySelector(".fg"), t = card.querySelector(".t"), ring = card.querySelector(".ring");
  if (!fg) return;
  const ex = exById(id);
  let frac = 0, label = `${holdOf(ex)}<small>sec</small>`, resting = false;
  if (run && run.id===id){
    const p = phaseAt(run, elapsedOf(run)), s = Math.ceil(p.left), h = run.q[Math.min(p.i, run.n-1)];
    const who = ex.both ? `set ${h.set}/${ex.sets}` : `${LEGWORD[h.leg]} ${h.set}/${ex.sets}`;
    if (p.stage==="lead") label = `${s}<small>${ex.both?"get ready":LEGWORD[h.leg]+" first"}</small>`;
    else if (p.stage==="hold"){ frac = 1 - p.left/run.dur; label = `${s}<small>${run.paused?"paused":who}</small>`; }
    else { resting = true; frac = 1 - p.left/run.rest; label = `${s}<small>${run.paused?"paused":ex.both?"rest":"next: "+LEGWORD[h.leg]}</small>`; }
  }
  ring.classList.toggle("resting", resting);
  fg.style.strokeDashoffset = String(C*(1-frac));
  t.innerHTML = label;
}

/* ---------- reps ---------- */
function addRep(id){
  const ex = exById(id), leg = curLeg(ex), S = sess(), R = repOf(ex,leg,S);
  if (R.s >= ex.sets) return;
  R.r += 1; vibrate(20);
  if (R.r >= ex.reps){
    R.s += 1; R.r = 0; vibrate([300,80,300]);
    fx(buzzerTrack());
    if (exDone(ex,S)){ save(); afterUnit(ex, session); return; }
    switchAfterSet(ex, leg, S);
  } else fx(tickTrack());
  save(); renderAll();
}
function switchAfterSet(ex, leg, S){
  if (ex.both) return;
  const R = repOf(ex,leg,S), other = leg==="L" ? "R" : "L", O = repOf(ex,other,S);
  // alternate: go to the other leg if it has fewer sets
  if (O.s < ex.sets && (O.s < R.s || R.s >= ex.sets)){ legSel[ex.id] = other; toast(`${LEGWORD[leg]} ${ex.sets>1?"set "+R.s+" ":""}done · now ${LEGWORD[other].toLowerCase()} leg`); }
  else if (R.s < ex.sets) toast(`${LEGWORD[leg]} set ${R.s} done · rest, then set ${R.s+1}`);
}
function undoRep(id){
  const ex = exById(id), R = repOf(ex,curLeg(ex),sess());
  if (R.r > 0) R.r -= 1;
  else if (R.s > 0){ R.s -= 1; R.r = ex.reps-1; }
  save(); renderAll();
}
function markReps(id){
  const ex = exById(id), leg = curLeg(ex), S = sess(), R = repOf(ex,leg,S);
  R.s = ex.sets; R.r = 0; save();
  if (exDone(ex,S)){ afterUnit(ex, session); return; }
  switchAfterSet(ex, leg, S); renderAll();
}

/* ---------- render ---------- */
function legChips(ex, S){
  const cur = run && run.id===ex.id ? (()=>{ const p = phaseAt(run, elapsedOf(run)); return p.stage==="hold" || p.stage==="lead" ? run.q[Math.min(p.i,run.n-1)].leg : null; })() : null;
  return ["L","R"].map(l=>{
    const n = setsOf(ex,l,S), ok = n >= ex.sets;
    const dots = Array.from({length:ex.sets},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("");
    return `<div class="chip ${ok?"ok":""} ${cur===l?"now":""}"><b>${l==="L"?"Left":"Right"}</b><span class="dots">${dots}</span><small>${n}/${ex.sets}</small></div>`;
  }).join("");
}
function updateLegs(id){ const ex = exById(id), el = document.querySelector(`#card-${id} .legchips`); if (el) el.innerHTML = legChips(ex, sess()); }
function legsHTML(ex, S){

  if (ex.type==="hold") return `<div class="legchips" aria-label="Sets per leg">${legChips(ex,S)}</div>`;
  const cur = curLeg(ex);
  return `<div class="legs" role="group" aria-label="Leg">${["L","R"].map(l=>{
    const ok = unitDone(ex,l,S);
    return `<button type="button" data-leg="${l}" data-ex="${ex.id}" aria-pressed="${l===cur}" class="${ok?"ok":""}"><span class="dot">${ok?"✓":""}</span>${l==="L"?"Left":"Right"}</button>`;
  }).join("")}</div>`;
}
function rxOf(ex){
  if (ex.type==="check"){
    if (ex.repsBy) return `Right ${ex.repsBy.R} · Left ${ex.repsBy.L} reps${ex.holdNote?" · "+ex.holdNote:""}`;
    return `${ex.reps} reps${ex.both?" · 1 set":" · each leg"}`;
  }
  if (ex.type==="reps") return `${ex.reps} reps × ${ex.sets} ${ex.sets===1?"set":"sets"} · each leg`;
  return `${ex.sets===1?"1 hold":ex.sets+" sets ×"} ${holdOf(ex)}s${ex.sets===1?"":" hold"}${ex.hold?" (fixed)":""} · ${ex.both?"both legs together":ex.sets===1?"each leg":"alternate left/right"}`;
}
function cardHTML(ex, i){
  const S = sess(), done = exDone(ex,S);
  let body;
  if (ex.type==="hold"){
    body = `<div class="timer">
      <div class="ring" style="--pc:${ringColor(ex)}"><svg viewBox="0 0 96 96" aria-hidden="true"><circle class="bg" cx="48" cy="48" r="42"/><circle class="fg" cx="48" cy="48" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="t" aria-live="off"></div></div>
      <div class="controls">
        <div class="btns" data-btns></div>
        <span class="meta" data-meta>${metaHTML(ex)}</span>
      </div></div>`;
  } else if (ex.type==="reps"){
    const leg = curLeg(ex), R = repOf(ex,leg,S), ldone = R.s >= ex.sets;
    const sets = Array.from({length:ex.sets},(_,s)=>{
      const full = s < R.s, cur = s === R.s;
      const val = full ? ex.reps : cur ? R.r : 0;
      return `<div class="set ${full?"full":""} ${cur&&!ldone?"cur":""}"><b>${val}/${ex.reps}</b>${ex.sets>1?`Set ${s+1}`:LEGWORD[leg]}</div>`;
    }).join("");
    body = `<div class="sets">${sets}</div>
      <div class="rep">
        <button type="button" class="tap" data-rep="${ex.id}" ${ldone?"disabled":""}>${ldone?`${LEGNAME[leg]} done`:`+1 rep`}</button>
        <button type="button" class="btn ghost" data-repundo="${ex.id}" ${(R.s||R.r)?"":"disabled"}>Undo</button>
      </div>
      ${ldone ? "" : `<span class="meta"><button type="button" class="link" data-repmark="${ex.id}">Mark ${ex.both?"":LEGWORD[leg].toLowerCase()+" leg "}done</button> if you counted yourself</span>`}`;
  } else {
    body = `<div class="checks">${(ex.repsBy ? ["R","L"] : legsOf(ex)).map(l=>{
      const ok = !!S.c[hkey(ex,l)], n = repsFor(ex,l);
      const label = l==="B" ? `${n} reps` : `${LEGWORD[l]} · ${n} reps`;
      return `<button type="button" class="checkbtn ${ok?"ok":""}" data-check="${ex.id}" data-cleg="${l}" aria-pressed="${ok}">
        <span class="box">${ok?"✓":""}</span><span class="cl"><b>${label}</b><small>${ok?"Done · tap to undo":"Tap when finished"}</small></span></button>`;
    }).join("")}</div>`;
  }
  return `<li class="card ${done?"done":""}" id="card-${ex.id}">
    <div class="card-head">
      <div class="num">${done?"✓":i+1}</div>
      <div class="card-title"><h3>${ex.name}</h3><span class="rx">${rxOf(ex)}</span></div>
    </div>
    ${legsHTML(ex,S)}
    <details><summary>How to do it</summary><ol>${ex.steps.map(s=>`<li>${s}</li>`).join("")}</ol></details>
    ${body}
  </li>`;
}
function metaHTML(ex){
  const S = sess(), total = legsOf(ex).reduce((a,l)=>a+setsOf(ex,l,S),0), max = ex.sets*legsOf(ex).length;
  const txt = ex.both ? `${total}/${ex.sets} sets` : `${total}/${max} holds`;
  return txt +
    (total ? ` · <button type="button" class="link" data-undo="${ex.id}">Undo last</button>` : "") +
    (total < max ? ` · <button type="button" class="link" data-mark="${ex.id}">Mark done</button>` : "");
}
function updateMeta(id){ const ex = exById(id), m = document.querySelector(`#card-${id} [data-meta]`); if (m) m.innerHTML = metaHTML(ex); }
function updateCard(id){
  const card = document.getElementById("card-"+id); if (!card) return;
  const b = card.querySelector("[data-btns]"); if (!b) return;
  const ex = exById(id), running = run && run.id===id && run.sess===session;
  const q = queueFor(ex, sess());
  if (!running) b.innerHTML = !q.length
    ? `<button type="button" class="btn ghost" disabled>All sets done</button>`
    : `<button type="button" class="btn" data-start="${id}">${q.length < ex.sets*legsOf(ex).length ? `Continue · ${ex.both?"set "+q[0].set:LEGWORD[q[0].leg]+" "+q[0].set}` : `Start ${ex.sets}×${holdOf(ex)}s${ex.both?"":" L/R"}`}</button>`;
  else if (run.paused) b.innerHTML = `<button type="button" class="btn" data-start="${id}">Resume</button><button type="button" class="btn ghost" data-stop="${id}">Stop</button>`;
  else b.innerHTML = `<button type="button" class="btn ghost" data-pause="${id}">Pause</button><button type="button" class="btn ghost" data-stop="${id}">Stop</button>`;
  drawRing(id);
}
function updateActive(){ document.querySelectorAll(".card").forEach(c=>c.classList.toggle("active", !!run && c.id==="card-"+run.id)); }

function fullDay(k){ const d = state.log[k]; return !!d && sessComplete(fixSess(d.am)) && sessComplete(fixSess(d.pm)); }
function streak(){
  let n = 0; const d = new Date();
  if (!fullDay(key(d))) d.setDate(d.getDate()-1);
  while (fullDay(key(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function dayLevel(k){
  const d = state.log[k]; if (!d) return 0;
  const am = fixSess(d.am), pm = fixSess(d.pm);
  const full = sessComplete(am) + sessComplete(pm);
  if (full===2) return 3; if (full===1) return 2;
  return sessStarted(am) || sessStarted(pm) ? 1 : 0;
}
function renderCal(){
  const cal = document.getElementById("cal");
  const dows = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(today); end.setDate(end.getDate() + (6 - ((today.getDay()+6)%7)));
  const start = new Date(end); start.setDate(start.getDate()-34);
  const words = ["nothing yet","started","1 session done","both sessions done"];
  let html = dows.map(d=>`<div class="dow">${d}</div>`).join("");
  for (let x = new Date(start); x <= end; x.setDate(x.getDate()+1)){
    const k = key(x), lv = dayLevel(k), future = x > today;
    const cls = future ? "future" : lv ? "l"+lv : "";
    const label = x.toLocaleDateString(undefined,{day:"numeric",month:"short"});
    html += `<div class="day ${cls} ${k===key(today)?"today":""}" title="${label}: ${future?"upcoming":words[lv]}" aria-label="${label}: ${future?"upcoming":words[lv]}">${x.getDate()}</div>`;
  }
  cal.innerHTML = html;
}
function renderAll(){
  const d = dayRec(), S = d[session], list = EXL(), N = list.length;
  document.getElementById("today-label").textContent = new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  document.querySelectorAll(".weeks button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.w===state.week)));
  document.querySelectorAll(".phase button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.p===state.phase)));
  const phased = list.filter(e=>e.type==="hold" && !e.hold).map(e=>e.name);
  document.getElementById("phase-note").textContent = `${PHASE_NOTE[state.phase].replace(".","")} for ${phased.join(", ").replace(/, ([^,]*)$/," and $1")}. Fixed holds keep their own time.`;
  document.querySelectorAll(".rest button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.r===state.rest)));
  const amN = countDone(d.am), pmN = countDone(d.pm);
  for (const s of ["am","pm"]){
    const n = s==="am"?amN:pmN, b = document.getElementById("s-"+s);
    b.setAttribute("aria-pressed", String(s===session));
    b.classList.toggle("complete", n===N);
    document.getElementById(`s-${s}-n`).textContent = n===N ? "Done ✓" : `${n}/${N} done`;
  }
  const sessDone = sessComplete(d.am) + sessComplete(d.pm);
  document.getElementById("sess-count").textContent = `${sessDone}/2`;
  document.getElementById("motto").textContent = sessDone===2 ? ALL_DONE : mottoFor(todayKey()+state.week);
  document.getElementById("bar").style.width = (unitsDone(S)/totalUnits()*100)+"%";
  document.getElementById("streak").textContent = streak();
  document.getElementById("list").innerHTML = list.map(cardHTML).join("");
  list.filter(e=>e.type==="hold").forEach(e=>updateCard(e.id));
  if (!document.getElementById("reset-sess").classList.contains("armed"))
    document.getElementById("reset-sess").textContent = `Reset ${SESSNAME[session].toLowerCase()} session`;
  updateActive(); renderCal();
}

/* ---------- events ---------- */
document.querySelector(".weeks").addEventListener("click", e=>{
  const b = e.target.closest("button[data-w]"); if (!b || b.dataset.w===state.week) return;
  if (run) stopTimer();
  state.week = b.dataset.w; for (const k in legSel) delete legSel[k];
  save(); renderAll(); toast(`${PROGRAMS[state.week].name} plan`);
});
document.querySelector(".phase").addEventListener("click", e=>{
  const b = e.target.closest("button[data-p]"); if (!b) return;
  if (run) stopTimer();
  state.phase = +b.dataset.p; save(); renderAll();
});
document.querySelector(".rest").addEventListener("click", e=>{
  const b = e.target.closest("button[data-r]"); if (!b) return;
  if (run) stopTimer();
  state.rest = +b.dataset.r; save(); renderAll();
});
document.querySelector(".sessions").addEventListener("click", e=>{
  const b = e.target.closest("button[data-s]"); if (!b || b.dataset.s===session) return;
  if (run) stopTimer();
  session = b.dataset.s; for (const k in legSel) delete legSel[k];
  disarm(); renderAll();
});
document.getElementById("test-sound").addEventListener("click", ()=>{
  fx(buzzerTrack()).then(ok=>{ if (!ok) toast("Sound blocked. Check volume and tap again."); });
  vibrate([300,100,300]);
});
document.getElementById("list").addEventListener("click", e=>{
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.leg){
    if (run && run.id===d.ex) stopTimer();
    legSel[d.ex] = d.leg; renderAll(); return;
  }
  if (d.start) startTimer(d.start);
  else if (d.pause) pauseTimer();
  else if (d.stop) stopTimer();
  else if (d.rep) addRep(d.rep);
  else if (d.repundo) undoRep(d.repundo);
  else if (d.repmark) markReps(d.repmark);
  else if (d.check){
    const ex = exById(d.check), S = sess(), k = hkey(ex, d.cleg);
    if (S.c[k]){ delete S.c[k]; save(); renderAll(); toast("Undone"); }
    else { S.c[k] = 1; vibrate(40); save();
      if (exDone(ex,S)) afterUnit(ex, session); else { renderAll(); toast(`${cheer()} ${LEGNAME[d.cleg]} done`); } }
  }
  else if (d.undo || d.mark){
    const ex = exById(d.undo||d.mark), S = sess();
    if (run && run.id===ex.id) stopTimer();
    if (d.undo){
      // remove the most recent hold: right leg if it's level with left, else left
      const legs = legsOf(ex), last = legs.length===1 ? legs[0] : (setsOf(ex,"R",S) >= setsOf(ex,"L",S) && setsOf(ex,"R",S) > 0 ? "R" : "L");
      const k = hkey(ex,last); S.h[k] = Math.max(0, Math.min(ex.sets,S.h[k]||0)-1); save(); renderAll(); toast("Last hold removed");
    } else { for (const l of legsOf(ex)) S.h[hkey(ex,l)] = ex.sets; save(); afterUnit(ex, session); }
  }
});
// Reset current session: two-step confirm inside the page
const resetBtn = document.getElementById("reset-sess"), cancelBtn = document.getElementById("reset-cancel");
let resetArmT;
function disarm(){ resetBtn.classList.remove("armed"); resetBtn.textContent = `Reset ${SESSNAME[session].toLowerCase()} session`; cancelBtn.hidden = true; clearTimeout(resetArmT); }
resetBtn.addEventListener("click", ()=>{
  if (!resetBtn.classList.contains("armed")){
    resetBtn.classList.add("armed"); resetBtn.textContent = `Tap again to clear ${SESSNAME[session].toLowerCase()}`; cancelBtn.hidden = false;
    resetArmT = setTimeout(disarm, 5000); return;
  }
  disarm(); if (run) stopTimer();
  dayRec()[session] = newSess(); for (const k in legSel) delete legSel[k];
  save(); renderAll(); toast(`${SESSNAME[session]} session cleared`);
});
cancelBtn.addEventListener("click", disarm);
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState==="visible" && run && !run.paused){ lockScreen(true); tick(); }
});
// roll over at midnight
let lastDay = todayKey();
setInterval(()=>{ if (todayKey()!==lastDay){ lastDay=todayKey(); if(!run){ for (const k in legSel) delete legSel[k]; renderAll(); } } }, 60000);

renderAll();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
